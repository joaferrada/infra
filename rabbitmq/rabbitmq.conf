# Formacion del cluster: lista fija de nodos (peer discovery classic_config)
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Permite conectarse con el usuario por defecto desde fuera del contenedor (solo entorno local)
loopback_users = none

listeners.tcp.default = 5672
management.tcp.port = 15672

# Protege el disco del host: el broker deja de aceptar publicaciones bajo este umbral
disk_free_limit.absolute = 1GB
